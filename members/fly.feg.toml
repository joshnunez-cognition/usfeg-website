# US FEG member site. Deploy from members/: fly deploy --config fly.feg.toml
app = 'usfeg-members'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  SITE = 'feg'
  NODE_ENV = 'production'
  PORT = '8080'
  PUBLIC_URL = 'https://members.usfeg.org'
  SIBLING_URL = 'https://members.usleg.org'
  DATA_DIR = '/data'
  CLIENT_IP_HEADER = 'Fly-Client-IP'
  BLUEPAY_MODE = 'mock'
  RCLONE_CONFIG = '/data/rclone/rclone.conf'
  BACKUP_REMOTE = 'onedrive:Member Site Backups/feg'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
